# Implausible behind nginx, for hosts that already run one.
#
# The Caddy config in this directory is the shorter path — it obtains
# certificates on its own. Use this if nginx is already terminating TLS.

server {
    listen 443 ssl http2;
    server_name analytics.example.com;   # <- your analytics hostname

    ssl_certificate     /etc/letsencrypt/live/analytics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.example.com/privkey.pem;

    # Implausible hashes the address it is handed and never stores it. Without
    # these, every visitor would hash to the proxy's address and the visitor
    # count would collapse to one.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Public: the tracker and the ingest endpoints.
    location = /i.js       { proxy_pass http://127.0.0.1:3000; }
    location = /api/i      { proxy_pass http://127.0.0.1:3000; }
    location = /api/event  { proxy_pass http://127.0.0.1:3000; }

    # Private: the dashboard, /api/stats and /api/health. v0 has no auth of its
    # own, so this block is what stands between your figures and the internet.
    location / {
        auth_basic           "Implausible";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 80;
    server_name analytics.example.com;
    return 301 https://$host$request_uri;
}
