name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The "< 1 KB tracker" claim is on the README, so it is a build gate.
      - name: Tracker size budget
        run: npm run tracker:size

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  privacy-invariants:
    name: Privacy invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Invariant 4: no cookies or client-side storage of any kind.
      - name: Tracker writes nothing to the client
        run: |
          if grep -nE 'document\.cookie|localStorage|sessionStorage|indexedDB' tracker/src/*.js; then
            echo "::error::Tracker must not use cookies or client-side storage (invariant 4)."
            exit 1
          fi
          echo "OK: tracker uses no client-side storage."

      # Invariant 1: raw IP is never persisted.
      - name: Schema has no raw IP column
        run: |
          if [ -f src/lib/schema.sql ] && \
             grep -nEi '^[[:space:]]*(ip|ip_address|ip_addr|remote_addr|client_ip)[[:space:]]+' src/lib/schema.sql; then
            echo "::error::Schema must not contain a raw IP column (invariant 1)."
            exit 1
          fi
          echo "OK: no raw IP column."

      # Invariant 1: raw IP is never logged either. Word boundaries matter here
      # so that "description" and friends do not trip the check.
      - name: No IP reaches a log line
        run: |
          if grep -rnE 'console\.(log|warn|error|info|debug)\([^)]*\b(ip|ipAddress|rawIp|remoteAddr|clientIp)\b' src/; then
            echo "::error::An IP address must never reach a log line (invariant 1)."
            exit 1
          fi
          echo "OK: no IP in any log statement."
